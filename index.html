<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 美式撞球</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,"PingFang TC",sans-serif;color:#fff}
#hud{position:fixed;top:12px;left:14px;font-size:14px;line-height:1.5;text-shadow:0 1px 3px #000;pointer-events:none;display:grid;gap:5px}
#hud .mode{font-size:12px;opacity:.7}
#hud .row{display:flex;align-items:center;gap:4px;padding:3px 8px 3px 4px;border-radius:8px;background:#0006}
#hud .row.cur{background:#1f5a3acc;box-shadow:0 0 0 1px #6fd39a88}
#hud .name{min-width:74px;font-weight:600}
#hud .grp{font-size:12px;opacity:.75;margin-right:4px}
.chip{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;box-shadow:inset -2px -2px 3px #0006;flex:none}
.chip b{width:10px;height:10px;border-radius:50%;background:#f4efe0;color:#111;font-size:7px;line-height:10px;text-align:center;font-weight:700}
.chip.off{opacity:.2;filter:grayscale(1)}
.chip.target{outline:2px solid #ffe066;outline-offset:1px}
#msg{position:fixed;top:38%;width:100%;text-align:center;font-size:30px;font-weight:600;text-shadow:0 2px 8px #000;pointer-events:none;transition:opacity .4s}
#toast{position:fixed;top:30%;width:100%;text-align:center;font-size:20px;font-weight:600;color:#ffe9a8;text-shadow:0 2px 6px #000;pointer-events:none;opacity:0;transition:opacity .3s,transform .3s}
#toast.on{opacity:1;transform:translateY(-8px)}
#power{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);width:320px;height:10px;border:1px solid #fff8;border-radius:6px;overflow:hidden}
#power div{height:100%;width:0;background:linear-gradient(90deg,#4c4,#ec3,#e33)}
#power i{position:absolute;top:-1px;bottom:-1px;width:2px;margin-left:-1px;background:#fff;opacity:0;box-shadow:0 0 4px #fff}
#power.max{box-shadow:0 0 12px #f44;border-color:#f66;animation:shake .07s linear infinite}
@keyframes shake{0%{transform:translate(calc(-50% - 2px),0)}50%{transform:translate(calc(-50% + 2px),-1px)}100%{transform:translate(calc(-50% - 1px),1px)}}
#tip{position:fixed;right:22px;bottom:22px;width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d8d2c2);box-shadow:0 2px 10px #000a;pointer-events:none}
#tip b{position:absolute;top:-22px;width:120px;left:-22px;text-align:center;font-size:12px;font-weight:500;text-shadow:0 1px 2px #000}
#tip i{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#d11;left:50%;top:50%}
#hint{position:fixed;bottom:44px;left:110px;right:110px;text-align:center;font-size:13px;opacity:.85;pointer-events:none;text-shadow:0 1px 3px #000}
.panel{background:#15110ddd;border:1px solid #ffffff22;border-radius:14px;padding:22px 26px;box-shadow:0 20px 60px #000c}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px;align-items:baseline}
.keys kbd{font:600 12px system-ui,sans-serif;background:#ffffff14;border:1px solid #ffffff2a;border-radius:5px;padding:1px 6px;white-space:nowrap;justify-self:end}
#helpPanel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);display:none;pointer-events:none}
#helpPanel.on{display:block}
#menu{z-index:10;position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0008;backdrop-filter:blur(6px);padding:16px}
#menu.on{display:flex}
#menu .panel{width:min(600px,100%);max-height:100%;overflow:auto;box-sizing:border-box}
#menu h1{margin:0 0 4px;font-size:26px;letter-spacing:.04em}
#menu .sub{opacity:.6;font-size:13px;margin-bottom:18px}
#menu h2{font-size:13px;opacity:.6;font-weight:600;margin:18px 0 8px}
#modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#menu button{font:600 14px system-ui,"PingFang TC",sans-serif;color:#fff;background:#1f5a3a;border:1px solid #6fd39a55;border-radius:9px;padding:11px 8px;cursor:pointer}
#menu button:hover{background:#2a7a4f}
#menu button.cur{box-shadow:0 0 0 2px #ffe066}
.netbox{background:#0003;border:1px solid #ffffff14;border-radius:12px;padding:12px;display:grid;gap:10px}
.nrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.nrow>b{font-size:13px;opacity:.7;min-width:64px}
.seg{display:flex;border-radius:9px;overflow:hidden;border:1px solid #6fd39a55}
#menu .seg button{border:0;border-radius:0;background:#0004;padding:9px 12px;opacity:.65}
#menu .seg button.on{background:#1f5a3a;opacity:1}
#create{margin-left:auto}
#room,#rLink{font:600 15px system-ui,sans-serif;color:#fff;background:#0006;border:1px solid #6fd39a55;border-radius:9px;padding:10px;min-width:0}
#room{flex:1;text-transform:uppercase;letter-spacing:.2em;text-align:center}
#netMsg{font-size:13px;color:#ff9b8a}#netMsg:empty{display:none}
#menu.online .local,#menu:not(.online) #roomPanel{display:none}
#roomPanel{display:grid;gap:12px;margin-top:14px}
.rstat{display:flex;align-items:center;gap:10px;font-size:18px}
.rstat i,#netBadge i{width:10px;height:10px;border-radius:50%;background:#e6b655;flex:none;animation:pulse 1.2s infinite}
#roomPanel.ok .rstat i{background:#4cd27a;animation:none}#roomPanel.lost .rstat i{background:#e65555;animation:none}#roomPanel.lost .rstat b{color:#ff9b8a}
#rInfo{font-size:13px;opacity:.7}#rScore{font-size:22px;font-weight:700}#rScore:empty{display:none}
.rhelp{font-size:13px;opacity:.7;margin-bottom:6px}
.rlink{display:flex;gap:8px}.rlink input{flex:1;font-size:13px!important}
.ract{display:flex;gap:8px}.ract button{flex:1}
#rPlay{background:#7a5a1c!important;border-color:#e6b65555!important}
#rLeave{background:#5a1f1f!important;border-color:#e6555555!important}
@keyframes pulse{50%{opacity:.35}}
#netBadge{position:fixed;top:14px;right:16px;z-index:4;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;background:#000a;border:1px solid #ffffff22;border-radius:20px;padding:7px 14px;pointer-events:none;text-shadow:none}
#netBadge[hidden]{display:none}
#netBadge span{opacity:.7;font-weight:500}
#netBadge.ok i{background:#4cd27a;animation:none}#netBadge.lost{border-color:#e65555;background:#3a0d0dcc}#netBadge.lost i{background:#e65555;animation:none}
#resume{width:100%;margin-top:10px;background:#7a5a1c!important;border-color:#e6b65555!important}
#menu label{display:flex;align-items:center;gap:12px;font-size:14px;margin:6px 0}
#menu label span{min-width:90px}
#menu input[type=range]{flex:1;accent-color:#6fd39a}
#menu .keys{grid-template-columns:auto 1fr auto 1fr}
#helpPanel{z-index:5}
@media (max-width:520px){#modes{grid-template-columns:repeat(2,1fr)}#menu .keys{grid-template-columns:auto 1fr}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="hud"></div>
<div id="msg"></div>
<div id="toast"></div>
<div id="hint"></div>
<div id="helpPanel" class="panel"><div class="keys"></div></div>
<div id="menu" class="on"><div class="panel">
  <h1>3D 美式撞球</h1>
  <div class="local">
    <div class="sub">選一個模式開始。遊戲中按 Esc 回到這裡。</div>
    <div id="modes"></div>
    <h2>連線對戰</h2>
    <div class="netbox">
      <div class="nrow"><b>開房間</b><div class="seg" id="segGame"><button data-v="8" class="on">8 號球</button><button data-v="9">9 號球</button></div>
        <div class="seg" id="segRace"><button data-v="1">搶 1 局</button><button data-v="3" class="on">搶 3 局</button><button data-v="5">搶 5 局</button></div><button id="create">建立房間</button></div>
      <div class="nrow"><b>加入房間</b><input id="room" placeholder="輸入 4 碼房號" maxlength="4" autocomplete="off"><button id="join">加入</button></div>
      <div id="netMsg"></div>
    </div>
  </div>
  <div id="roomPanel">
    <div class="rstat"><i></i><b id="rStat"></b></div>
    <div id="rInfo"></div>
    <div id="rScore"></div>
    <div id="rLinkRow"><div class="rhelp">把這個連結傳給朋友，對方打開就會自動加入：</div><div class="rlink"><input id="rLink" readonly><button id="rCopy">複製邀請連結</button></div></div>
    <div class="ract"><button id="rPlay">進入球桌</button><button id="rRetry" hidden>重新連線</button><button id="rLeave">離開對戰</button></div>
  </div>
  <button id="resume" hidden>繼續目前這局</button>
  <h2>設定</h2>
  <label><span>音量</span><input type="range" id="vol" min="0" max="1" step="0.05"></label>
  <label><span>滑鼠靈敏度</span><input type="range" id="sens" min="0.3" max="2" step="0.05"></label>
  <h2>操作</h2><div class="keys"></div>
</div></div>
<div id="netBadge" hidden></div>
<div id="power"><div></div><i></i></div>
<div id="tip"><b></b><i></i></div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---- 真實尺寸 (公尺)：9 呎球台，球徑 57.15mm ----
const R = 0.028575, L = 1.27, W = 0.635;
const BALL_E = 0.95, ROLL_DECEL = 0.1 /* 滾動阻力 μ≈0.01 → 0.1 m/s²；台呢越快越小 */, STEP = 1 / 1000;
const G = 9.81, MU_SLIDE = 0.2, MU_RAIL = 0.2, SPIN_DECEL = 30; // 滑動摩擦、庫邊摩擦、側旋衰減 (rad/s²)
const CUSH = 0.05, RAIL = 0.13, TOP = 0.045;
const CG = 0.08, SG = 0.06; // 角袋/中袋開口
const FOV = 55;

// ---- 場景 ----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0806);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.15;
const camera = new THREE.PerspectiveCamera(FOV, innerWidth / innerHeight, 0.01, 50);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

scene.add(new THREE.HemisphereLight(0xffeedd, 0x201810, 0.4));
const lamps = []; // 燈罩和燈泡：俯視時隱藏，才不會擋住台面
for (const x of [-0.75, 0, 0.75]) {
  const s = new THREE.SpotLight(0xfff0d8, 9, 5, 0.85, 0.6, 2);
  s.position.set(x, 1.0, 0); s.target.position.set(x, 0, 0);
  s.castShadow = true; s.shadow.mapSize.set(1024, 1024); s.shadow.bias = -0.0002; s.shadow.radius = 6;
  scene.add(s, s.target);
  const shade = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.16, 32, 1, true),
    new THREE.MeshStandardMaterial({ color: 0x0c3a22, side: THREE.DoubleSide, roughness: 0.4, metalness: 0.4 }));
  shade.position.set(x, 1.06, 0); scene.add(shade);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.035), new THREE.MeshBasicMaterial({ color: 0xfff6e0 }));
  bulb.position.set(x, 1.0, 0); scene.add(bulb); lamps.push(shade, bulb);
}

// ---- 球台 ----
// 材質貼圖全部用 canvas 程式產生：台呢纖維噪點、木紋
function canvasTex(w, h, draw, rx, ry) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  t.anisotropy = 8; t.colorSpace = THREE.SRGBColorSpace; return t;
}
const feltTex = canvasTex(256, 256, (g, w, h) => { // 細碎纖維：每個像素亮度隨機 ±
  const im = g.createImageData(w, h);
  for (let i = 0; i < im.data.length; i += 4) { const v = 222 + (Math.random() - 0.5) * 46; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0);
}, 8, 8); // UV 單位是公尺 → 每 12.5 公分重複一次
const woodTex = canvasTex(1024, 256, (g, w, h) => { // 波浪狀的深淺紋理線
  g.fillStyle = '#5b2a12'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 220; i++) {
    const y = Math.random() * h, ph = Math.random() * 6.28, amp = 2 + Math.random() * 6;
    g.strokeStyle = Math.random() < 0.6 ? `rgba(28,10,3,${0.08 + Math.random() * 0.3})` : `rgba(150,80,40,${0.05 + Math.random() * 0.15})`;
    g.lineWidth = 0.5 + Math.random() * 2.5; g.beginPath();
    for (let x = 0; x <= w; x += 16) g.lineTo(x, y + amp * Math.sin(x / w * 6.2832 * 2 + ph));
    g.stroke();
  }
}, 0.7, 2.5);
const clothMat = new THREE.MeshPhysicalMaterial({ color: 0x0f5a33, map: feltTex, bumpMap: feltTex, bumpScale: 0.5, roughness: 0.92,
  sheen: 0.35, sheenRoughness: 0.6, sheenColor: new THREE.Color(0x2a8a58) }); // sheen = 絨布邊緣的柔光
const woodMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, map: woodTex, roughness: 0.55, clearcoat: 1, clearcoatRoughness: 0.12 }); // 亮光漆
const leatherMat = new THREE.MeshStandardMaterial({ color: 0x1a110a, roughness: 0.75, side: THREE.DoubleSide });
const pearlMat = new THREE.MeshStandardMaterial({ color: 0xf2ead8, roughness: 0.25, metalness: 0.1 });
function add(geo, mat, y = 0, cast = true) { // 由 Shape (x, -z) 擠出的幾何 → 轉成水平放在高度 y
  const m = new THREE.Mesh(geo, mat); m.rotation.x = -Math.PI / 2; m.position.y = y;
  m.castShadow = cast; m.receiveShadow = true; scene.add(m); return m;
}
function box(w, h, d, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; scene.add(m); return m;
}
const OL = L + CUSH + RAIL, OW = W + CUSH + RAIL, LC = L + CUSH, WC = W + CUSH;
const pockets = [];
for (const s of [-1, 1]) {
  for (const t of [-1, 1]) pockets.push({ x: s * (L + 0.02), z: t * (W + 0.02), r: 0.065 });
  pockets.push({ x: 0, z: s * (W + 0.04), r: 0.06 });
}
// 庫邊外緣矩形 (LC × WC) 一圈取樣，落在袋口圓內的點沿法線推出 (push=1 → 庫框內緣) 或推入 (push=-1 → 台面外緣)
function pocketOutline(push) {
  const pts = [], C = [[LC, -WC], [LC, WC], [-LC, WC], [-LC, -WC]];
  const put = (x, z, a) => {
    const dx = Math.cos(a) * push, dz = Math.sin(a) * push; let t = 0;
    for (const p of pockets) {
      const ox = x - p.x, oz = z - p.z, b = ox * dx + oz * dz, c = ox * ox + oz * oz - p.r * p.r;
      if (c < 0) t = Math.max(t, -b + Math.sqrt(b * b - c));
    }
    const v = new THREE.Vector2(x + dx * t, -(z + dz * t)), l = pts[pts.length - 1];
    if (!l || l.distanceTo(v) > 1e-5) pts.push(v);
  };
  for (let i = 0; i < 4; i++) {
    const [ax, az] = C[i], [bx, bz] = C[(i + 1) % 4], n = Math.ceil(Math.hypot(bx - ax, bz - az) / 0.003);
    const th = Math.atan2(-(bx - ax), bz - az); // 外法線角度
    for (let k = 0; k <= 12; k++) put(ax, az, th - Math.PI / 2 + k * Math.PI / 24); // 轉角掃過 90°，角袋那塊圓弧才補得到
    for (let j = 1; j < n; j++) put(ax + (bx - ax) * j / n, az + (bz - az) * j / n, th);
  }
  return pts;
}
// 台面：挖了六個袋口的石板 + 台呢
add(new THREE.ExtrudeGeometry(new THREE.Shape(pocketOutline(-1)), { depth: 0.05, bevelEnabled: false, curveSegments: 1 }), clothMat, -0.05, false);
// 庫框：圓角外框，內緣沿袋口挖弧，上緣倒圓角
{
  const s = new THREE.Shape(), r = 0.06;
  s.moveTo(-OL + r, -OW); s.lineTo(OL - r, -OW); s.absarc(OL - r, -OW + r, r, -Math.PI / 2, 0);
  s.lineTo(OL, OW - r); s.absarc(OL - r, OW - r, r, 0, Math.PI / 2);
  s.lineTo(-OL + r, OW); s.absarc(-OL + r, OW - r, r, Math.PI / 2, Math.PI);
  s.lineTo(-OL, -OW + r); s.absarc(-OL + r, -OW + r, r, Math.PI, Math.PI * 1.5);
  s.holes.push(new THREE.Path(pocketOutline(1)));
  const depth = 0.15, bt = 0.008;
  add(new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelThickness: bt, bevelSize: 0.008, bevelSegments: 3, curveSegments: 16 }), woodMat, TOP - depth - bt);
}
box(2 * OL - 0.08, 0.16, 2 * OW - 0.08, woodMat, 0, -0.2, 0); // 下方裙板
for (const s of [-1, 1]) for (const t of [-1, 1]) box(0.14, 0.5, 0.14, woodMat, s * (OL - 0.2), -0.52, t * (OW - 0.15));
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0x2a1c12, roughness: 0.8 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -0.76; floor.receiveShadow = true; scene.add(floor);
// 袋口：皮革袋筒 + 袋底
for (const p of pockets) {
  const cup = new THREE.Mesh(new THREE.CylinderGeometry(p.r, p.r * 0.85, 0.11, 32, 1, true), leatherMat);
  cup.position.set(p.x, -0.055, p.z); scene.add(cup);
  const bot = new THREE.Mesh(new THREE.CircleGeometry(p.r * 0.85, 32), leatherMat);
  bot.rotation.x = -Math.PI / 2; bot.position.set(p.x, -0.11, p.z); scene.add(bot);
}
// 庫邊準星（菱形珠母貝）：長邊每 1/8、短邊每 1/4
{
  const g = new THREE.CircleGeometry(0.009, 4), mid = CUSH + RAIL / 2;
  const at = (x, z) => { const m = new THREE.Mesh(g, pearlMat); m.rotation.x = -Math.PI / 2; m.position.set(x, TOP + 0.0006, z); scene.add(m); };
  for (const k of [-3, -2, -1, 1, 2, 3]) for (const s of [-1, 1]) at(k * L / 4, s * (W + mid));
  for (const k of [-1, 0, 1]) for (const s of [-1, 1]) at(s * (L + mid), k * W / 2);
}

// 庫邊：物理用線段 + 對應的模型（俯視梯形擠出 + 倒圓角，袋口那端斜切成袋角）
const segs = [];
for (const s of [-1, 1]) segs.push([-L + CG, s * W, -SG, s * W], [SG, s * W, L - CG, s * W], [s * L, -W + CG, s * L, W - CG]);
for (const [x1, z1, x2, z2] of segs) {
  const len = Math.hypot(x2 - x1, z2 - z1), ux = (x2 - x1) / len, uz = (z2 - z1) / len;
  const horiz = z1 === z2, nx = horiz ? 0 : Math.sign(x1), nz = horiz ? Math.sign(z1) : 0;
  const jaw = x => (horiz && Math.abs(x) < 0.2 ? 0.012 : 0.035); // 中袋袋角較直、角袋斜 45° 左右
  const bs = 0.004, bt = 0.005, h = 0.038, o = CUSH - bs;
  const pts = [[x1 + nx * bs, z1 + nz * bs], [x2 + nx * bs, z2 + nz * bs],
    [x2 + nx * o + ux * jaw(x2), z2 + nz * o + uz * jaw(x2)], [x1 + nx * o - ux * jaw(x1), z1 + nz * o - uz * jaw(x1)]];
  add(new THREE.ExtrudeGeometry(new THREE.Shape(pts.map(([x, z]) => new THREE.Vector2(x, -z))),
    { depth: h - 2 * bt, bevelEnabled: true, bevelThickness: bt, bevelSize: bs, bevelSegments: 3 }), clothMat, bt);
}

// ---- 球 ----
const COLORS = ['#f4efe0', '#f2c200', '#1544a8', '#cc1d1d', '#58288a', '#f06818', '#0b7a3f', '#7a1c20', '#111111'];
function ballTex(n) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 256;
  const g = c.getContext('2d'), col = COLORS[n > 8 ? n - 8 : n];
  g.fillStyle = n > 8 ? COLORS[0] : col; g.fillRect(0, 0, 512, 256);
  if (n > 8) { g.fillStyle = col; g.fillRect(0, 68, 512, 120); }
  if (n > 0) for (const u of [128, 384]) {
    g.fillStyle = COLORS[0]; g.beginPath(); g.arc(u, 128, 32, 0, 7); g.fill();

  return [game.breakShot ? '開球：WASD 在開球線後擺母球' : game.ballInHand && '自由球：WASD 移動母球', '按住左鍵蓄力，放開出桿', '方向鍵 打點', 'Q/E 仰角', 'Tab 按鍵說明'].filter(Boolean).join('　·　');
}

// ---- 連線對戰（PeerJS 點對點）----
// 只傳出桿參數，兩邊各自跑同一套物理；每桿結束由出桿方送出所有球的最終位置與比賽狀態蓋過去，保證兩邊一致。
// 每秒互送心跳，8 秒沒收到任何東西就當作斷線（關分頁時 WebRTC 自己的 close 事件可能要等很久）。
// ponytail: 信任雙方瀏覽器（朋友對戰用），不防作弊；連不上的網路環境要加 TURN 伺服器
let net = null, shotBy = 0, aimSent = 0;
const match = { race: 3, score: [0, 0], rack: 0 }; // 搶 race 局；rack 決定誰開球（輪流）
const netQ = [], PEER_PREFIX = 'pool3d-room-', $ = id => document.getElementById(id);
const notMine = () => cpuTurn() || !!(net && (!net.open || game.cur !== net.me) && !game.over);
const send = m => net?.open && net.conn.send(m);
const matchDone = () => Math.max(...match.score) >= match.race;
const scoreText = () => net ? `你 ${match.score[net.me]} : ${match.score[1 - net.me]} 對手` : '';
const inviteLink = () => net ? location.origin + location.pathname + '?room=' + net.code : '';
const loadPeer = () => window.Peer ? Promise.resolve() : new Promise((ok, bad) => {
  const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
  sc.onload = ok; sc.onerror = bad; document.head.append(sc);
});
function leaveNet() {
  if (net) { const n = net; net = null; try { n.conn?.open && n.conn.send({ t: 'bye' }); } catch {} setTimeout(() => n.peer?.destroy(), 200); }
  netQ.length = 0; history.replaceState(null, '', location.pathname);
}
function sendSync(reset) {
  send({ t: 'sync', reset, mode, match, b: balls.map(b => [b.x, b.z, b.active ? 1 : 0]),
    g: { cur: game.cur, groups: game.groups, ballInHand: game.ballInHand, breakShot: game.breakShot, over: game.over } });
}
function applySync(m) {
  mode = m.mode; Object.assign(match, m.match);
  if (m.reset) newGame();
  m.b.forEach(([x, z, a], i) => (a ? place(balls[i], x, z) : hide(balls[i])));
  Object.assign(game, m.g); state = game.over ? 'over' : 'aim'; ai = null; // 訊息文字由本機自己的 endShot 產生（「你/對手」視角才對）
}
function netTick() { // 在主迴圈裡依序處理收到的訊息：出桿/同步要等本機這桿的球停下來
  while (netQ.length) {
    const m = netQ[0], idle = state === 'aim' || state === 'over';
    if (m.t === 'aim') { if (state === 'aim' && notMine()) { yaw = m.y; if (game.ballInHand || game.breakShot) { cueBall.x = m.x; cueBall.z = m.z; } } }
    else if (m.t === 'shot') { if (state !== 'aim') break; cueBall.x = m.x; cueBall.z = m.z; yaw = m.y; shoot(m.p, m.tip, m.el); }
    else if (m.t === 'sync') { if (!idle && !m.reset) break; applySync(m); }

  }
  if (net?.open && state === 'aim' && !notMine() && performance.now() - aimSent > 66) { // 每秒 15 次把瞄準方向給對手看
    aimSent = performance.now(); send({ t: 'aim', y: yaw, x: cueBall.x, z: cueBall.z });
  }
}
function connLost(bye) {
  const c = net.conn; net.conn = null; net.open = false; net.lost = true; netQ.length = 0; c?.close();
  flash(bye ? '對手離開了對戰' : '與對手的連線中斷了', 1e9);
  document.exitPointerLock?.(); // 跳回選單，讓狀態一目了然
}
setInterval(() => { // 心跳
  if (!net?.open) return;
  send({ t: 'ping' });
  if (performance.now() - net.rx > 8000) connLost(false);
}, 1000);
function setupConn(c) {
  net.conn = c;
  c.on('open', () => {
    Object.assign(net, { open: true, lost: false, rx: performance.now() });
    flash(net.me === 0 ? '對手已加入！' : `已加入房間 ${net.code}`, 3); toast('連線成功');
    if (net.me === 0) sendSync(true); // 房主送出完整局面（斷線重連也一樣接回來）
  });
  c.on('data', m => {
    if (!net || net.conn !== c) return;
    net.rx = performance.now();
    if (m.t === 'bye') connLost(true); else if (m.t !== 'ping') netQ.push(m);
  });
  c.on('close', () => { if (net?.conn === c) connLost(false); });
}
async function hostRoom(r, race) {
  leaveNet(); mode = r === 9 ? 3 : 1; game.ch = 0; Object.assign(match, { race, score: [0, 0], rack: 0 });
  const code = Math.random().toString(36).slice(2, 6).toUpperCase();
  net = { me: 0, open: false, code, ready: false }; newGame();
  try { await loadPeer(); } catch { leaveNet(); return ($('netMsg').textContent = 'PeerJS 載入失敗，請檢查網路'); }
  const peer = net.peer = new Peer(PEER_PREFIX + code);
  peer.on('open', () => { if (net?.peer === peer) net.ready = true; });
  peer.on('connection', c => (net?.conn ? c.close() : setupConn(c)));
  peer.on('error', e => { if (net?.peer !== peer || net.ready) return; leaveNet(); $('netMsg').textContent = '建立房間失敗：' + e.type; });
}
async function joinRoom(code) {
  code = code.trim().toUpperCase(); if (code.length !== 4) return ($('netMsg').textContent = '房號是 4 個英數字');
  leaveNet(); net = { me: 1, open: false, code };
  history.replaceState(null, '', '?room=' + code);
  try { await loadPeer(); } catch { leaveNet(); return ($('netMsg').textContent = 'PeerJS 載入失敗，請檢查網路'); }
  const peer = net.peer = new Peer(), mine = net;
  const fail = t => { if (net !== mine || net.open || net.lost) return; leaveNet(); $('netMsg').textContent = t; };
  peer.on('open', () => net === mine && setupConn(peer.connect(PEER_PREFIX + code, { reliable: true, serialization: 'json' })));
  peer.on('error', e => fail(e.type === 'peer-unavailable' ? `找不到房間 ${code}，請確認房號，或房主已離開` : '連線錯誤：' + e.type));
  setTimeout(() => fail('連線逾時：可能是網路擋住了點對點連線，換個網路再試'), 15000);
}
// 選單：開房選項（分段按鈕）
for (const id of ['segGame', 'segRace']) $(id).addEventListener('click', e => {
  if (!e.target.dataset.v) return;
  $(id).querySelectorAll('button').forEach(b => b.classList.toggle('on', b === e.target));
});
const segVal = id => +$(id).querySelector('.on').dataset.v;
$('create').addEventListener('click', () => { $('netMsg').textContent = ''; hostRoom(segVal('segGame'), segVal('segRace')); });
$('join').addEventListener('click', () => { $('netMsg').textContent = ''; joinRoom($('room').value); });
$('room').addEventListener('keydown', e => { if (e.key === 'Enter') $('join').click(); });
$('rCopy').addEventListener('click', () => {
  $('rLink').select();
  navigator.clipboard?.writeText(inviteLink()).then(() => { $('rCopy').textContent = '已複製 ✓'; setTimeout(() => ($('rCopy').textContent = '複製邀請連結'), 2000); }, () => {});
});
$('rPlay').addEventListener('click', play);
$('rLeave').addEventListener('click', () => { leaveNet(); mode = 1; newGame(); openMenu(true); });
$('rRetry').addEventListener('click', () => joinRoom(net.code));
// 房間面板與畫面右上角狀態徽章：每一幀依狀態更新（只在內容變了才寫 DOM）
let netUiKey = '';
function updateNetUi() {
  const st = !net ? '' : net.open ? 'ok' : net.lost ? 'lost' : net.me === 0 ? (net.ready ? 'wait' : 'make') : 'conn';
  const key = [st, net?.code, scoreText(), match.race, mode, started, menuOpen].join('|');
  if (key === netUiKey) return; netUiKey = key;
  menuEl.classList.toggle('online', !!net); resumeBtn.hidden = !started || !!net;
  const badge = $('netBadge'); badge.className = st; badge.hidden = !net; $('roomPanel').className = st;
  if (!net) return;
  const label = { make: '建立房間中…', wait: '等待對手加入…', conn: `正在連線房間 ${net.code}…`, ok: net.me === 0 ? '對手已加入，可以開始了' : '已加入房間，可以開始了',
    lost: net.me === 0 ? '對手已離線・可傳邀請連結讓他重新加入' : '與房主的連線中斷' }[st];
  $('rStat').textContent = label;
  $('rInfo').textContent = `房號 ${net.code}　·　${rules()} 號球　·　搶 ${match.race} 局　·　你是${net.me === 0 ? '房主（先開球）' : '挑戰者'}`;
  $('rScore').textContent = st === 'ok' || net.lost ? scoreText() : '';
  $('rLink').value = inviteLink(); $('rLinkRow').hidden = net.me !== 0;
  $('rPlay').textContent = started ? '回到球桌' : '進入球桌';
  $('rRetry').hidden = !(net.me === 1 && net.lost);
  badge.innerHTML = `<i></i>${label}<span>房號 ${net.code}${st === 'ok' || net.lost ? '　' + scoreText() + `（搶 ${match.race}）` : ''}</span>`;
}
{ const q = new URLSearchParams(location.search).get('room'); if (q) joinRoom(q); } // 打開邀請連結就直接連線

// ---- 主迴圈 ----
const clock = new THREE.Clock(), camTarget = new THREE.Vector3(), camPos = new THREE.Vector3(), camDir = new THREE.Vector3(1, 0, 0), follow = new THREE.Vector3(), q = new THREE.Quaternion(), axis = new THREE.Vector3();
let acc = 0;
camera.position.set(-L - 0.8, 0.6, 0);
function frame(_, fixedDt) {
  const dt = fixedDt ?? Math.min(clock.getDelta(), 0.05);
  sfxBudget = 0;
  updateNetUi();
  if (menuOpen && !fixedDt && !net) { updateRoll(false); updateHud(); renderer.render(scene, camera); return; } // 選單開著 = 暫停
  if (state === 'moving') {
    acc += dt; simT += dt;
    while (acc >= STEP) { step(STEP); acc -= STEP; }
    if (balls.every(b => !b.active || (!b.vx && !b.vz && !b.wx && !b.wz && !b.vy && !b.y))) { endShot(); if (net && shotBy === net.me) sendSync(); }
  }
  if (net) netTick();
  if (state === 'stroke') { // 球桿往前送 70ms
    stroke.t += dt;
    if (stroke.t >= 0.07) { launch(stroke); stroke = null; }
  }
  // 電腦回合：先停頓、轉向目標、蓄力、出桿
  if (state === 'aim' && cpuTurn()) {
    if (!ai) ai = { ...aiPlan(), t: 0 };
    ai.t += dt;
    if (ai.t > 0.6) yaw += Math.atan2(Math.sin(ai.yaw - yaw), Math.cos(ai.yaw - yaw)) * Math.min(1, dt * 4);
    if (ai.t > 1.8) {
      power = Math.min(ai.power, power + dt * 0.7);
      if (power >= ai.power) { yaw = ai.yaw; shoot(power, { x: 0, y: 0.15 }, 0.05); ai = null; }
    }
  }
  // 方向鍵調整打點
  tip.x += ((keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0)) * dt * 1.5;
  tip.y += ((keys.ArrowUp ? 1 : 0) - (keys.ArrowDown ? 1 : 0)) * dt * 1.5;
  elev = Math.min(1.1, Math.max(0.05, elev + ((keys.KeyE ? 1 : 0) - (keys.KeyQ ? 1 : 0)) * dt * 0.6));
  elevEl.textContent = `仰角 ${Math.round(elev * 180 / Math.PI)}°`;
  const tl = Math.hypot(tip.x, tip.y); if (tl > 1) { tip.x /= tl; tip.y /= tl; }
  tipDot.style.left = 50 + tip.x * 25 + '%'; tipDot.style.top = 50 - tip.y * 25 + '%';
  const dx = Math.cos(yaw), dz = Math.sin(yaw);

  // 自由球擺位
  if (state === 'aim' && (game.ballInHand || game.breakShot) && !notMine()) { // 開球：只能擺在開球線 (x = -L/2) 後面
    const f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0), r = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
    const nx = Math.max(-L + R, Math.min(game.breakShot ? -L / 2 : L - R, cueBall.x + (dx * f - dz * r) * 0.5 * dt));
    const nz = Math.max(-W + R, Math.min(W - R, cueBall.z + (dz * f + dx * r) * 0.5 * dt));
    if (!overlaps(nx, nz, cueBall)) { cueBall.x = nx; cueBall.z = nz; }
  }
  if (charging) power = Math.min(1, power + dt * 0.7);

  if (state === 'replay') {
    replay.t += dt * 0.5; // 半速
    while (replay.i < rec.length - 1 && rec[replay.i + 1].t <= replay.t) replay.i++;
    const f = rec[replay.i].f;
    balls.forEach((b, i) => {
      const o = i * 8;
      b.mesh.position.set(f[o], f[o + 1], f[o + 2]); b.mesh.quaternion.set(f[o + 3], f[o + 4], f[o + 5], f[o + 6]); b.mesh.visible = !!f[o + 7];
    });
    if (replay.i >= rec.length - 1) { state = replay.prev; replay = null; balls.forEach(b => (b.mesh.visible = b.active)); }
  } else for (const b of balls) {
    const m = b.mesh;
    if (b.fall) {
      const f = b.fall; f.t += dt;
      m.position.x += (f.x - m.position.x) * Math.min(1, dt * 12);
      m.position.z += (f.z - m.position.z) * Math.min(1, dt * 12);
      m.position.y = R - 4 * f.t * f.t;
      if (f.t > 0.35) { m.visible = false; b.fall = null; }
      continue;
    }
    if (!b.active) continue;
    const w = Math.hypot(b.wx, b.wy, b.wz);
    if (w) m.quaternion.premultiply(q.setFromAxisAngle(axis.set(b.wx / w, b.wy / w, b.wz / w), w * dt));
    m.position.set(b.x, R + b.y, b.z);
  }
  if (state === 'moving') snap();

  const aiming = state === 'aim' || state === 'stroke';
  cue.visible = aiming;
  aimLine.visible = ghost.visible = aiming && helpers;
  if (!aiming || !helpers) objLine.visible = cueLine.visible = false;
  if (aiming) {
    if (helpers) updateAim(dx, dz);
    // 球桿對準打點：往右 (-dz, dx) 與往上偏移 0.5R·tip；出桿時從拉桿位置送到桿頭碰球
    const t = stroke ? stroke.tip : tip, pull = stroke ? stroke.p * (1 - stroke.t / 0.07) : power;
    const { d, rt, up } = cueFrame(yaw, stroke ? stroke.elev : elev);
    const hx = cueBall.x + 0.5 * R * (t.x * rt[0] + t.y * up[0]), hy = R + cueBall.y + 0.5 * R * t.y * up[1], hz = cueBall.z + 0.5 * R * (t.x * rt[2] + t.y * up[2]);
    const back = Math.sqrt(R * R * (1 - 0.25 * (t.x * t.x + t.y * t.y))) + 0.002 + (stroke ? 0 : 0.01) + pull * 0.25;

    cue.lookAt(hx + d[0], hy + d[1], hz + d[2]);
  }
  // 第一人稱：瞄準時鏡頭在球桿後方；出桿後鏡頭停在原地看球跑；重播時繞台慢轉
  for (const m of lamps) m.visible = !topView;
  if (state === 'replay') {
    const a = 0.6 + replay.t * 0.25;
    camPos.set(Math.cos(a) * 2.4, 1.5, Math.sin(a) * 1.6); camTarget.set(0, 0, 0);
  } else if (topView) { camPos.set(0, 3.0, 0.001); camTarget.set(0, 0, 0); }
  else if (aiming) {
    camPos.set(cueBall.x - dx * dist * Math.cos(pitch), R + dist * Math.sin(pitch), cueBall.z - dz * dist * Math.cos(pitch));
    camTarget.set(cueBall.x + dx * 0.4, R, cueBall.z + dz * 0.4);
  } else if (state === 'moving') {
    // 出桿後：鏡頭慢慢升高，跟著「正在動的球」的速度加權中心走（母球給一點底權重）
    let sx = 0, sz = 0, sw = 0;
    for (const b of balls) if (b.active) { const w = Math.hypot(b.vx, b.vz) + (b === cueBall ? 0.03 : 0); sx += b.x * w; sz += b.z * w; sw += w; }

  camera.position.lerp(camPos, k);
  camera.userData.t = (camera.userData.t || camTarget.clone()).lerp(camTarget, k);
  camera.lookAt(camera.userData.t);
  fovKick *= Math.exp(-dt * 5); // 出桿瞬間鏡頭往前衝一下再回來
  camera.fov = FOV - fovKick; camera.updateProjectionMatrix();

  if ((msgTimer -= dt) <= 0) msgEl.style.opacity = 0;
  updateRoll(state === 'moving'); updateMarker(performance.now() / 1000);

}
renderer.setAnimationLoop(frame);
newGame(); msgEl.style.opacity = 0;
window.pool = { get net() { return net; }, ac, sfx, camera, balls, step, launch, shoot, tip, setElev: v => (elev = v), game, planFrom, tick: n => { for (let i = 0; i < n; i++) frame(0, 1 / 60); }, setYaw: v => (yaw = v), setMode: m => { mode = m; newGame(); }, get state() { return state; }, get rec() { return rec; }, replay: () => { replay = { t: 0, i: 0, prev: state }; state = 'replay'; } }; // 除錯用
</script>
